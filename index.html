<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preload" as="image" href="./cover.webp">
<style>
:root{
  --gold:#c9a24a; --gold-l:#f3dc9a; --ivory:#fbf5e9; --ink:#3b1a10; --wine:#7a1328;
  --script:'Pinyon Script',cursive; --caps:'Cinzel',serif; --serif:'Cormorant Garamond',Georgia,serif; --hi:'Tiro Devanagari Hindi',serif; --hid:'Rozha One','Tiro Devanagari Hindi',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#12030a}
body{font-family:var(--serif);color:var(--ivory);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 10%,#3d0815 0%,#17030a 60%,#080104 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
html[lang=hi] body{--serif:'Tiro Devanagari Hindi','Cormorant Garamond',serif}
img{-webkit-user-drag:none;user-select:none}

.device{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;container-type:size;background:#1a050b}
@media (min-width:720px){
  .device{width:min(470px,calc(94vh*.5));height:94vh;border-radius:32px;
    box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px rgba(243,220,154,.22),0 0 0 9px rgba(0,0,0,.4),0 0 0 10px rgba(243,220,154,.12)}
}
.app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.app::-webkit-scrollbar{display:none}
.scene{position:relative;height:100cqh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;isolation:isolate;background:#1a050b}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

/* ===== photo stage: bg, mid (between), fg (couple cut-out) ===== */
.layers{position:absolute;inset:0;z-index:0;transform-origin:var(--fo,50% 40%);will-change:transform}
.scene.in .layers{animation:kbIn 3.2s cubic-bezier(.2,.6,.2,1) both,kb 22s 3.2s ease-in-out infinite alternate}
@keyframes kbIn{from{transform:scale(1.14)}to{transform:scale(1.03)}}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.09)}}
.layers img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 50%)}
.layers .bg{z-index:0}.layers .mid{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}.layers .fg{z-index:2}
.scrim{position:absolute;inset:0;z-index:3;pointer-events:none}
.content{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 7cqh) 8cqw calc(env(safe-area-inset-bottom,0px) + 6.5cqh)}

/* ===== type ===== */
.foil{background:linear-gradient(100deg,#7a5414 0%,#d9b25a 14%,#fff2c4 26%,#c9973a 40%,#f2d68a 55%,#9c7020 70%,#f5df9c 86%,#7a5414 100%);
  background-size:240% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 8s linear infinite}
.wfoil{background:linear-gradient(100deg,#4d0816 0%,#8e1b2e 18%,#b8455a 30%,#7a1328 44%,#a0662a 58%,#6a0f22 74%,#9b2a3e 88%,#4d0816 100%);
  background-size:240% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 10s linear infinite}
@keyframes shimmer{to{background-position:-240% center}}
.script.foil,.script.wfoil{padding:0 .22em;margin:0 -.22em}
.script{font-family:var(--script);font-weight:400;line-height:1.1}
.kick{font-family:var(--caps);font-size:clamp(9px,2.6cqw,11.5px);letter-spacing:.34em;text-transform:uppercase}
html[lang=hi] .kick{font-family:var(--hi);letter-spacing:.04em;font-size:clamp(12.5px,3.7cqw,15.5px)}
.hid{font-family:var(--hid)}
.orn{display:block;margin:1.2cqh auto;width:50cqw;max-width:240px;height:14px}
.sd{text-shadow:0 2px 14px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4)}
.sl{text-shadow:0 0 18px rgba(255,246,236,.95),0 0 4px rgba(255,246,236,.9)}
.glowL{filter:drop-shadow(0 0 10px rgba(255,248,240,.95)) drop-shadow(0 0 2px rgba(255,248,240,.9))}
.glowD{filter:drop-shadow(0 3px 10px rgba(0,0,0,.55))}

.rv{opacity:0;transform:translateY(16px);filter:blur(5px);transition:opacity 1.2s ease,transform 1.3s cubic-bezier(.2,.7,.2,1),filter 1.2s ease}
.scene.in .rv{opacity:1;transform:none;filter:none}
.scene.in .d1{transition-delay:.25s}.scene.in .d2{transition-delay:.5s}.scene.in .d3{transition-delay:.75s}.scene.in .d4{transition-delay:1s}
.scene.in .d5{transition-delay:1.25s}.scene.in .d6{transition-delay:1.5s}.scene.in .d7{transition-delay:1.75s}.scene.in .d8{transition-delay:2s}
.scene.in .glowL.rv,.scene.in .glowD.rv{filter:drop-shadow(0 0 10px rgba(255,248,240,.95)) drop-shadow(0 0 2px rgba(255,248,240,.9))}
.scene.in .glowD.rv{filter:drop-shadow(0 3px 10px rgba(0,0,0,.55))}

/* ===== chrome ===== */
.chrome{position:absolute;z-index:85;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px}
.chrome.l{left:12px}.chrome.r{right:12px}
.pill{height:34px;border-radius:99px;padding:0 3px;display:flex;align-items:center;background:rgba(20,4,10,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(243,220,154,.35);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lang button{height:27px;padding:0 11px;border-radius:99px;font:600 11px var(--caps);letter-spacing:.12em;color:rgba(243,220,154,.8);transition:all .3s}
.lang button:last-child{font:500 14px var(--hi);letter-spacing:0}
.lang button.on{background:linear-gradient(135deg,#f6e2a4,#c9973a);color:#3a1206}
.mute{width:34px;justify-content:center;gap:2.5px;display:none}
.mute.show{display:flex}
.mute i{width:2.5px;border-radius:2px;background:var(--gold-l);height:5px;animation:eq 1.1s ease-in-out infinite}
.mute i:nth-child(2){animation-delay:.25s}.mute i:nth-child(3){animation-delay:.5s}.mute i:nth-child(4){animation-delay:.12s}
.mute.off i{animation:none;height:2px;opacity:.5}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
.dots{position:absolute;z-index:50;right:7px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.dots button{width:5px;height:5px;border-radius:50%;background:rgba(243,220,154,.4);transition:all .4s;box-shadow:0 0 3px rgba(0,0,0,.5)}
.dots button.on{height:18px;border-radius:4px;background:var(--gold-l);box-shadow:0 0 8px rgba(243,220,154,.8)}
.draft{position:absolute;z-index:56;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 54px);padding:4px 10px;border-radius:99px;
  background:#fff1bf;color:#6b3b00;font:700 9px/1 var(--caps);letter-spacing:.14em;box-shadow:0 2px 10px rgba(0,0,0,.3);white-space:nowrap}
.cue{position:absolute;z-index:30;bottom:calc(env(safe-area-inset-bottom,0px) + 1.6cqh);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;
  font:500 8.5px var(--caps);letter-spacing:.34em;color:var(--cuec,rgba(243,220,154,.8));pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.5)}
html[lang=hi] .cue{font:400 11px var(--hi);letter-spacing:.04em}
.cue svg{width:20px;height:20px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.tap{position:absolute;z-index:31;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:6px 13px 6px 9px;border-radius:99px;
  background:rgba(20,4,10,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(243,220,154,.35);
  font:500 9px var(--caps);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-l);white-space:nowrap;transition:opacity .6s;pointer-events:none}
html[lang=hi] .tap{font:400 12.5px var(--hi);letter-spacing:.02em}
.tap i{width:14px;height:14px;border-radius:50%;position:relative}
.tap i::before{content:"";position:absolute;inset:4px;border-radius:50%;background:currentColor}
.tap i::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.3px solid currentColor;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.scene.tapped .tap{opacity:0}
.toast{position:absolute;z-index:90;left:50%;bottom:12cqh;transform:translate(-50%,20px);opacity:0;transition:all .4s;background:rgba(20,4,10,.9);
  border:1px solid rgba(243,220,154,.4);color:var(--gold-l);padding:10px 16px;border-radius:12px;font-size:15px;max-width:86%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:99px;text-decoration:none;white-space:nowrap;
  font:700 9.5px var(--caps);letter-spacing:.15em;text-transform:uppercase;transition:transform .2s}
html[lang=hi] .btn{font:400 14px var(--hi);letter-spacing:.02em}
.btn:active{transform:scale(.96)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.gold{background:linear-gradient(135deg,#f8e6ae,#d4a64a 50%,#b07d24);color:#3a1206;box-shadow:0 8px 22px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.line{border:1px solid rgba(243,220,154,.8);color:var(--gold-l);background:rgba(20,4,10,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ===== mid-layer particles (between photo and couple) ===== */
.mp{position:absolute;top:-6%;left:0;will-change:transform;animation:mfall linear infinite}
@keyframes mfall{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(var(--dx),118cqh,0) rotate(var(--r))}}
.mp.rose{width:var(--s);height:calc(var(--s)*.8);border-radius:60% 0 60% 60%;background:radial-gradient(circle at 30% 30%,#ff8fa6,#c8203f 55%,#7a0a20);opacity:.9}
.mp.mari{width:calc(var(--s)*.8);height:calc(var(--s)*.5);border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd36b,#f59e0b 60%,#c2600a)}
.mp.conf{width:calc(var(--s)*.9);height:calc(var(--s)*.45);background:linear-gradient(135deg,#fff2c4,#d9a441);border-radius:1px}
.mp.conf.p{background:linear-gradient(135deg,#ffd1e0,#e0577a)}
.mp.blush{width:var(--s);height:calc(var(--s)*.8);border-radius:60% 0 60% 60%;background:radial-gradient(circle at 30% 30%,#fff,#f6c6d2 55%,#d98aa0);opacity:.9}
.lan{position:absolute;bottom:-8%;width:var(--w);height:calc(var(--w)*1.3);border-radius:40% 40% 30% 30%/50% 50% 25% 25%;
  background:radial-gradient(circle at 50% 72%,#fff6c8 0%,#ffbf5a 34%,#e26a22 72%,#9a2f10 100%);
  box-shadow:0 0 14px 5px rgba(255,170,70,.55),0 0 40px 14px rgba(255,130,40,.22);animation:rise linear forwards}
@keyframes rise{0%{transform:translate(0,0) scale(1);opacity:0}6%{opacity:1}100%{transform:translate(var(--sx),-118cqh) scale(.3);opacity:.15}}

/* ===== ENVELOPE INTRO ===== */
.intro{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s ease;overflow:hidden}
.intro.gone{opacity:0;pointer-events:none}
.silk{position:absolute;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(70% 45% at 25% 18%,rgba(255,140,150,.16),transparent 65%),radial-gradient(60% 50% at 85% 85%,rgba(255,100,90,.10),transparent 60%),
  linear-gradient(162deg,#681327 0%,#470b1a 38%,#2c0610 72%,#1c030a 100%)}
.silk::before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(118deg,rgba(255,255,255,.028) 0 1px,transparent 1px 5px)}
.silk::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,210,190,.09) 50%,transparent 62%);background-size:260% 100%;animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%{background-position:130% 0}100%{background-position:-130% 0}}
.damask{position:absolute;inset:0;z-index:0;background-image:var(--damask);background-size:72px 72px;pointer-events:none}
.intro .top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 9cqh);left:0;right:0;text-align:center;z-index:6;transition:opacity .8s}
.intro .top .inv{font-family:var(--hi);font-size:clamp(15px,4.6cqw,20px)}
.intro .top .for{margin-top:2.2cqh;color:rgba(243,220,154,.75)}
.intro .top .gname{font-family:var(--script);font-size:clamp(36px,12cqw,58px);line-height:1.2;padding:0 6cqw}
.intro .top .gsub{font-style:italic;font-size:clamp(14px,4cqw,17px);color:#f3e2c4}
.intro .top .efam{margin-top:1.6cqh;color:rgba(243,220,154,.8);padding:0 10cqw;line-height:1.7}
.intro.opening .top,.intro.opening .bottom{opacity:0}
.intro .bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 9cqh);left:0;right:0;z-index:6;transition:opacity .6s;display:flex;justify-content:center}
.intro .bottom .tap{position:static;transform:none}
.env{position:relative;z-index:5;width:88cqw;max-width:420px;aspect-ratio:1.42;margin-top:14cqh;perspective:1600px;transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.env .back{position:absolute;inset:0;border-radius:5px;overflow:hidden;background:var(--paper),linear-gradient(160deg,#f7ecd6,#ead8b4);box-shadow:0 34px 70px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.35)}
.env .back::after{content:"";position:absolute;inset:6px;border:1px solid rgba(196,154,69,.55);border-radius:3px;pointer-events:none}
.env .liner{position:absolute;left:5%;right:5%;top:4%;height:70%;clip-path:polygon(0 0,100% 0,100% 30%,50% 100%,0 30%);background:var(--damaskdk),linear-gradient(135deg,#8a1630,#5a0b1d)}
.env .card{position:absolute;left:7%;right:7%;top:7%;height:86%;z-index:2;border-radius:3px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform 1.5s cubic-bezier(.5,0,.2,1)}
.env .card img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.env .card::after{content:"";position:absolute;inset:5px;border:1px solid rgba(243,220,154,.8)}
.env .pocket{position:absolute;inset:0;z-index:3;pointer-events:none}
.env .pocket svg{width:100%;height:100%;display:block;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.08))}
.env .addr{position:absolute;z-index:4;left:0;right:0;bottom:7%;text-align:center;pointer-events:none}
.env .addr .mono{font:600 clamp(12px,3.6cqw,15px) var(--caps);letter-spacing:.3em;color:#a8823a}
.env .addr .sub{font-style:italic;font-size:clamp(12px,3.4cqw,15px);color:#7a5a3a}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,0,.3,1)}
.env .flap .f,.env .flap .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:polygon(0 0,100% 0,50% 100%)}
.env .flap .f{background:var(--paper),linear-gradient(180deg,#f9efdc,#ecdcb9)}
.env .flap .b{transform:rotateX(180deg);background:var(--damaskdk),linear-gradient(0deg,#8a1630,#5a0b1d)}
.env .flapline{position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity .3s}
.env .seal{position:absolute;z-index:7;left:50%;top:62%;width:22cqw;max-width:104px;aspect-ratio:1;transform:translate(-50%,-50%);cursor:pointer}
.env .seal .half{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.4,0,.6,1),opacity 1.1s}
.env .seal .half.a{clip-path:polygon(0 0,52% 0,46% 35%,55% 60%,47% 100%,0 100%)}
.env .seal .half.b{clip-path:polygon(52% 0,100% 0,100% 100%,47% 100%,55% 60%,46% 35%)}
.env .seal svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.env .seal::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1.5px solid rgba(243,220,154,.7);animation:ping 2s ease-out infinite;pointer-events:none}
.intro.opening .seal::after{display:none}
.intro.opening .seal .a{transform:translate(-40%,90%) rotate(-35deg);opacity:0}
.intro.opening .seal .b{transform:translate(40%,90%) rotate(35deg);opacity:0}
.intro.flap .flap{transform:rotateX(180deg)}
.intro.flap .flapline{opacity:0}
.intro.behind .flap{z-index:1}
.intro.rise .card{transform:translateY(-58%)}
.intro.rise .env{transform:translateY(16%)}
.intro.zoom .env{transform:translateY(40%) scale(2.6);transition:transform 1.3s cubic-bezier(.6,0,.3,1)}
.intro .glow{position:absolute;z-index:4;width:120cqw;height:120cqw;border-radius:50%;background:radial-gradient(closest-side,rgba(255,215,150,.28),transparent);pointer-events:none;animation:breath 5s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.08);opacity:.7}}

/* ===== S1 BLESSING ===== */
#bless{background:var(--paper),radial-gradient(130% 90% at 50% 20%,#fffbf3 0%,#f8eedb 55%,#efdfc1 100%)}
#bless .content{justify-content:center;color:var(--ink);padding-bottom:15cqh}
.corner{position:absolute;z-index:3;width:34cqw;max-width:170px;pointer-events:none}
.corner.tr{top:0;right:0}.corner.tl{top:0;left:0;transform:scaleX(-1)}
.corner.br{bottom:0;right:0;width:36cqw;max-width:180px}.corner.bl{bottom:0;left:0;width:36cqw;max-width:180px;transform:scaleX(-1)}
.ganesh{position:relative;width:42cqw;max-width:210px;cursor:pointer}
.ganesh .halo{position:absolute;left:50%;top:46%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,206,120,.55),rgba(255,206,120,.18) 55%,transparent);animation:breath 4.5s ease-in-out infinite}
.ganesh .rays{position:absolute;left:50%;top:46%;width:170%;aspect-ratio:1;border-radius:50%;opacity:.35;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(201,151,58,.35) 0 2deg,transparent 2deg 12deg);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent);mask:radial-gradient(closest-side,#000 30%,transparent);animation:spin 80s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ganesh img{position:relative;width:100%}
.ganesh.pulse .halo{animation:pulse 1.2s ease}
@keyframes pulse{40%{transform:translate(-50%,-50%) scale(1.25);opacity:1}}
#bless .om{font-family:var(--hid);font-size:clamp(20px,6.4cqw,30px);color:#8e1b2a;margin-top:1.6cqh}
#bless .shl{font-family:var(--hi);font-size:clamp(14px,4.3cqw,19px);line-height:1.65;margin-top:.8cqh;color:#8a5f14}
#bless .tr{font-style:italic;font-size:clamp(14px,4cqw,17px);color:#6b4a30;max-width:80cqw;margin-top:1cqh;line-height:1.35}
#bless .bl{margin-top:1.2cqh;color:#8a6420}
#bless .tap{position:static;transform:none;margin-top:2cqh;background:rgba(122,19,40,.06);color:#8a6420;border-color:rgba(138,100,32,.35)}

/* ===== S2 COVER ===== */
#cover{--op:50% 0%;--fo:55% 30%}
#cover .content{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 10.5cqh)}
#cover .names{position:absolute;z-index:1;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 16.5cqh);text-align:center;pointer-events:none}

function waxSVG(){
  const [a,b]=CONFIG.monogram; let blob='', dots='';
  for(let i=0;i<=40;i++){ const t=i/40*Math.PI*2, r=46+Math.sin(t*7)*1.6+Math.sin(t*13+1)*1.1+(i%5===0?1.2:0); blob+=(i?'L':'M')+(50+Math.cos(t)*r).toFixed(2)+' '+(50+Math.sin(t)*r).toFixed(2); }
  for(let i=0;i<24;i++){ const t=i/24*Math.PI*2; dots+=`<circle cx="${(50+Math.cos(t)*29).toFixed(2)}" cy="${(50+Math.sin(t)*29).toFixed(2)}" r="1" fill="#e9a0aa" opacity=".55"/>`; }
  const txt=(x,y,f,o)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="27" fill="${f}" opacity="${o}" letter-spacing="-1">${esc(a)}<tspan font-size="14" dy="-6" font-weight="400">✦</tspan><tspan dy="6">${esc(b)}</tspan></text>`;
  return `<svg viewBox="0 0 100 100"><path d="${blob}Z" fill="url(#waxG)"/><circle cx="50" cy="50" r="33" fill="#7e0d1e" opacity=".55"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#3d040c" stroke-width="2.2" opacity=".55"/><circle cx="49.4" cy="49.4" r="33" fill="none" stroke="#ff8a9a" stroke-width=".7" opacity=".45"/>
  ${dots}${txt(50,61,'#5a0612',.7)}${txt(49.3,60.3,'#e7a9b2',.55)}<ellipse cx="34" cy="26" rx="16" ry="6" fill="#fff" opacity=".2" transform="rotate(-28 34 26)"/></svg>`;

const dObj=(d,t='12:00')=>new Date(`${d}T${t}:00+05:30`);

const fmtDate=d=>dObj(d).toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Kolkata'});

function fmtTime(t){ let [h,m]=t.split(':').map(Number); const mm=String(m).padStart(2,'0');
  if(LANG==='hi'){ const part=h<12?'प्रातः':h<16?'दोपहर':h<19?'सायं':'रात्रि'; return `${part} ${h%12||12}:${mm} बजे से`; }
  return `${h%12||12}:${mm} ${h>=12?'PM':'AM'} ${T('onwards')}`; }
function gcal(date,start,end,title){
  const f=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00', V=CONFIG.venue.en;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+f(date,start)+'/'+f(date,end||start)+
    '&ctz=Asia/Kolkata&location='+encodeURIComponent(`${V.name}, ${V.addr}`)+'&details='+encodeURIComponent(`${CONFIG.bride.name} weds ${CONFIG.groom.name}. With love, the Bohra family.`);
}
function guestName(){
  let h=decodeURIComponent((location.hash||'').slice(1)); const q=new URLSearchParams(location.search).get('to');
  if(q) h=q; if(!h||h==='guestlinks') return ''; return h.replace(/[-_+]+/g,' ').replace(/\s+/g,' ').trim().slice(0,48);

function midParticles(kind,n){

}

/* ---------------- effects canvas: gold dust + bursts ---------------- */
const FX=(()=>{
  const c=$('#fx'), g=c.getContext('2d'); let W=0,H=0,P=[],last=performance.now(),dust=[];
  function resize(){ const r=c.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; c.width=W*d; c.height=H*d; g.setTransform(d,0,0,d,0,0);
    dust=Array.from({length:26},()=>({x:R(0,W),y:R(0,H),r:R(.6,1.7),v:R(5,14),ph:R(0,6.28),a:R(.25,.7)})); }
  addEventListener('resize',resize); resize();
  const PAL={rose:['#a3122e','#c8203f','#e0577a','#f28aa2','#7a0a20'],marigold:['#f59e0b','#ffb02e','#f27a0c','#ffd23f'],gold:['#f3dc9a','#ffe9a8','#d9b25a','#fff4c9'],
    party:['#ffd1e0','#e0577a','#f3dc9a','#d9a441','#ffffff','#c9b6ff'],haldi:['#f6b80b','#ffd23f','#f2a50a','#ffe066']};
  const pick=a=>a[(Math.random()*a.length)|0];
  const add=p=>P.push(Object.assign({x:0,y:0,vx:0,vy:0,ay:0,rot:R(0,6.28),vr:R(-2,2),t:0,life:6,size:8,drag:.995,sway:0,ph:R(0,6.28),col:'#fff',k:'petal'},p));
  const fall=(k,n,pal)=>{ for(let i=0;i<n;i++) add({k,x:R(-10,W+10),y:R(-80,-10),vx:R(-12,12),vy:R(45,95),sway:R(18,44),size:R(6,11),col:pick(PAL[pal]),life:R(7,11)}); };
  const burst=(x,y,k,n,pal,sp=300)=>{ for(let i=0;i<n;i++){ const a=R(0,6.28),v=R(sp*.3,sp); add({k,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.35,ay:260,drag:.97,size:R(4,9),col:pick(PAL[pal]),life:R(1.4,2.6),vr:R(-9,9)}); } };
  const sparkle=(x,y,n=26)=>{ for(let i=0;i<n;i++){ const a=R(0,6.28),v=R(30,190); add({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,ay:25,drag:.95,size:R(1.6,4.2),col:pick(PAL.gold),life:R(.8,1.7)}); } };
  const hearts=(x,y,n=10)=>{ for(let i=0;i<n;i++) add({k:'heart',x:x+R(-30,30),y:y+R(-10,10),vx:R(-40,40),vy:R(-150,-60),ay:-8,drag:.98,size:R(8,15),col:pick(['#e0577a','#f28aa2','#c8203f','#f3dc9a']),life:R(1.6,2.6),vr:R(-1,1)}); };
  const splash=(x,y)=>{ for(let i=0;i<7;i++){ const a=R(0,6.28),d=R(0,40); add({k:'blob',x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,size:R(10,26),col:pick(PAL.haldi),life:R(1.4,2.2),grow:R(1,1.8)}); } burst(x,y,'marigold',26,'marigold',300); };
  function draw(p){ const k=p.t/p.life, a=Math.min(1,(1-k)*3); g.save(); g.globalAlpha=Math.max(0,a); g.translate(p.x,p.y); g.rotate(p.rot);
    if(p.k==='petal'){ const s=p.size,f=Math.cos(p.ph+p.t*3); g.scale(1,.5+.5*Math.abs(f)); g.fillStyle=p.col; g.beginPath(); g.moveTo(0,-s); g.bezierCurveTo(s*.95,-s*.7,s*.8,s*.6,0,s); g.bezierCurveTo(-s*.8,s*.6,-s*.95,-s*.7,0,-s); g.fill();
      g.globalAlpha=Math.max(0,a)*.25; g.fillStyle='#fff'; g.beginPath(); g.ellipse(-s*.25,-s*.25,s*.22,s*.5,0,0,6.28); g.fill(); }
    else if(p.k==='marigold'){ g.fillStyle=p.col; g.beginPath(); g.ellipse(0,0,p.size*.7,p.size*.45,0,0,6.28); g.fill(); }
    else if(p.k==='confetti'){ const f=Math.cos(p.ph+p.t*7); g.scale(1,f); g.fillStyle=p.col; g.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); }
    else if(p.k==='spark'){ g.globalCompositeOperation='lighter'; const s=p.size*(1-k*.4); g.fillStyle=p.col; g.beginPath(); for(let i=0;i<8;i++){ const r=i%2?s*.3:s*1.7,an=i*Math.PI/4; g.lineTo(Math.cos(an)*r,Math.sin(an)*r);} g.fill(); }
    else if(p.k==='heart'){ const s=p.size/16; g.scale(s,s); g.fillStyle=p.col; g.beginPath(); g.moveTo(0,6); g.bezierCurveTo(-14,-4,-6,-14,0,-6); g.bezierCurveTo(6,-14,14,-4,0,6); g.fill(); }
    else if(p.k==='blob'){ const s=p.size*(1+Math.min(1,p.t*4)*p.grow); const gr=g.createRadialGradient(0,0,0,0,0,s); gr.addColorStop(0,p.col); gr.addColorStop(.7,p.col); gr.addColorStop(1,'rgba(246,184,11,0)'); g.fillStyle=gr; g.beginPath(); g.arc(0,0,s,0,6.28); g.fill(); }
    g.restore(); }
  function tick(now){ const dt=Math.min(.05,(now-last)/1000); last=now; g.clearRect(0,0,W,H);
    g.save(); g.globalCompositeOperation='lighter';
    for(const d of dust){ d.y-=d.v*dt; d.x+=Math.sin(now/1800+d.ph)*6*dt; if(d.y<-5){ d.y=H+5; d.x=R(0,W); }
      const tw=.5+.5*Math.sin(now/700+d.ph*3); g.globalAlpha=d.a*tw*.7; g.fillStyle='#ffe2a0'; g.beginPath(); g.arc(d.x,d.y,d.r,0,6.28); g.fill();
      g.globalAlpha=d.a*tw*.15; g.beginPath(); g.arc(d.x,d.y,d.r*4,0,6.28); g.fill(); }
    g.restore();
    for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.t+=dt; if(p.t>=p.life||p.y>H+60){ P.splice(i,1); continue; }
      p.vy+=p.ay*dt; p.vx*=p.drag; p.vy*=p.drag; p.x+=(p.vx+Math.sin(p.ph+p.t*2)*p.sway)*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; draw(p); }
    requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
  return {fall,burst,sparkle,hearts,splash,size:()=>({W,H})};
})();

/* ---------------- music: plays CONFIG.music if set ---------------- */
const Sound=(()=>{ let au=null,on=true;
  function start(){ if(!CONFIG.music) return; try{ au=new Audio(CONFIG.music); au.loop=true; au.volume=0; const p=au.play(); if(p&&p.catch) p.catch(()=>{});
      let v=0; const f=setInterval(()=>{ v=Math.min(.85,v+.05); if(au) au.volume=on?v:0; if(v>=.85) clearInterval(f); },120); $('#mute').classList.add('show'); }catch(e){} }
  function toggle(){ on=!on; if(au){ au.volume=on?.85:0; if(on&&au.paused) au.play().catch(()=>{}); } $('#mute').classList.toggle('off',!on); }
  return {start,toggle};
})();

function lanterns(n,initial){ const el=$('#lanterns'); if(!el) return;

    el.appendChild(l); setTimeout(()=>l.remove(),(dur+1)*1000); } }
const ACT={
  bless(e){ const gEl=$('#ganesh'); if(!e.target.closest('#ganesh')) return false; gEl.classList.remove('pulse'); void gEl.offsetWidth; gEl.classList.add('pulse'); const c=center(gEl); FX.sparkle(c.x,c.y,40); FX.fall('marigold',26,'marigold'); },
  cover(e){ const {x,y}=lp(e); FX.hearts(x,y,14); FX.sparkle(x,y,30); FX.fall('petal',34,'rose'); },
  families(e){ FX.fall('petal',30,'rose'); },
  save(e){ const {x,y}=lp(e); FX.hearts(x,y,12); FX.sparkle(x,y,24); },
  haldi(e){ const {x,y}=lp(e); FX.splash(x,y); FX.fall('marigold',30,'marigold'); },
  sangeet(e){ const {x,y}=lp(e); FX.burst(x,y,'confetti',70,'party',360); FX.sparkle(x,y,20); },
  wedding(e){ FX.fall('petal',60,'rose'); FX.fall('marigold',24,'marigold'); const {x,y}=lp(e); FX.sparkle(x,y,20); },
  closing(e){ lanterns(5); const {x,y}=lp(e); FX.sparkle(x,y,24); }
};
let io=null, cdTimer=null, lanTimer=null;
function wire(keepIndex){
  const app=$('#app'), scenes=$$('.scene'), dots=$$('#dots button');
  $('#dots').onclick=e=>{ const b=e.target.closest('button'); if(b) scenes[+b.dataset.i].scrollIntoView({behavior:'smooth'}); };
  scenes.forEach(sc=>sc.addEventListener('click',e=>{ if(e.target.closest('a,button')) return; const f=ACT[sc.dataset.fx]; if(f && f(e)!==false) sc.classList.add('tapped'); }));
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting) return; const i=scenes.indexOf(en.target); en.target.classList.add('in'); dots.forEach((d,k)=>d.classList.toggle('on',k===i)); window._cur=i;
    const nx=scenes[i+1]; if(nx) $$('img',nx).forEach(im=>{ if(im.loading==='lazy') im.loading='eager'; }); }),{root:app,threshold:.55});
  scenes.forEach(s=>io.observe(s));
  if(keepIndex!=null && scenes[keepIndex]){ app.scrollTop=scenes[keepIndex].offsetTop; scenes[keepIndex].classList.add('in'); }
  const target=dObj(CONFIG.wedding.date,CONFIG.wedding.start);
  const cd=()=>{ let s=Math.max(0,(target-Date.now())/1000|0); const v=[s/86400|0,(s%86400)/3600|0,(s%3600)/60|0,s%60]; $$('[data-c]').forEach(b=>b.textContent=String(v[+b.dataset.c]).padStart(2,'0')); };
  clearInterval(cdTimer); cd(); cdTimer=setInterval(cd,1000);
  lanterns(12,true); clearInterval(lanTimer); lanTimer=setInterval(()=>{ if(!document.hidden) lanterns(1); },1800);
  const url=CONFIG.shareUrl||location.href.split('#')[0];
  const msg=LANG==='hi'?`॥ श्री गणेशाय नमः ॥\nरीनाक्षी एवं यश के शुभ विवाह में आप सपरिवार सादर आमंत्रित हैं।\nहल्दी 3 दिसंबर · संगीत 4 दिसंबर · शुभ विवाह 5 दिसंबर 2026 · जोधपुर\nनिमंत्रण खोलें: ${url}`:`॥ Shri Ganeshaya Namah ॥\nYou and your family are cordially invited to the wedding of Reenaxi & Yash.\nHaldi 3 Dec · Sangeet 4 Dec · Shubh Vivah 5 Dec 2026 · Jodhpur\nOpen the invitation: ${url}`;
  $('#shareWa').href='https://wa.me/?text='+encodeURIComponent(msg);
  $('#copyLink').onclick=async()=>{ try{ await navigator.clipboard.writeText(url); toast(T('copied')); }catch(e){ toast(url); } };
}
function setLang(l){ if(l===LANG) return; LANG=l; try{ localStorage.setItem('ry-lang',l); }catch(e){} const idx=window._cur||0; build(); wire(idx); if($('#intro .env')){ buildIntro(); hookIntro(); } }
$('#lang').onclick=e=>{ const b=e.target.closest('button'); if(b) setLang(b.dataset.l); };
$('#mute').onclick=()=>Sound.toggle();

function hookIntro(){
  const el=$('#intro'), seal=$('#seal'); let opened=false;
  const open=()=>{ if(opened) return; opened=true; Sound.start();
    const c=center(seal); FX.sparkle(c.x,c.y,50);
    el.classList.add('opening');
    setTimeout(()=>el.classList.add('flap'),450);
    setTimeout(()=>el.classList.add('behind'),950);
    setTimeout(()=>{ el.classList.add('rise'); FX.fall('petal',40,'rose'); FX.fall('marigold',20,'marigold'); },1150);
    setTimeout(()=>el.classList.add('zoom'),2900);
    setTimeout(()=>{ el.classList.add('gone'); $('#bless').classList.add('in'); },3500);
    setTimeout(()=>el.remove(),4800); };
  seal.addEventListener('click',open); seal.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') open(); });
  $('#env').addEventListener('click',open);
}
function maker(){
  if(location.hash!=='#guestlinks') return;
  const base=CONFIG.shareUrl||location.href.split('#')[0], m=document.createElement('div'); m.className='maker';
  m.innerHTML=`<div class="box"><h3>PERSONAL GUEST LINKS</h3><p>Type a guest's name. Their envelope will open with their name on it.</p>
    <input id="gname" placeholder="e.g. Sharma Family"><div class="out" id="gout">${esc(base)}</div>
    <div class="row"><button class="btn gold" id="gcopy">Copy link</button><a class="btn line" id="gwa" target="_blank" rel="noopener" href="#">Send on WhatsApp</a><button class="btn line" id="gclose">Close</button></div></div>`;
  $('#device').appendChild(m);
  const upd=()=>{ const n=$('#gname').value.trim().replace(/[^A-Za-z0-9 ]+/g,'').replace(/\s+/g,'-'); const u=n?`${base}#${n}`:base; $('#gout').textContent=u;
    $('#gwa').href='https://wa.me/?text='+encodeURIComponent(`॥ Shri Ganeshaya Namah ॥\nYou and your family are cordially invited to the wedding of Reenaxi & Yash.\nHaldi 3 Dec · Sangeet 4 Dec · Shubh Vivah 5 Dec 2026 · Jodhpur\nYour invitation: ${u}`); return u; };
  $('#gname').oninput=upd; upd();
  $('#gcopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(upd()); toast('Link copied'); }catch(e){ toast(upd()); } };
  $('#gclose').onclick=()=>m.remove();
}
build(); wire(); buildIntro(); hookIntro(); maker();
</script>
